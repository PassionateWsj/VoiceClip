<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>语音转录</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: #000; color: #fff;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  .app {
    display: flex; flex-direction: column; align-items: center;
    height: 100%;
    padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px);
  }

  .lang-bar {
    display: flex; gap: 4px; background: #1c1c1e; border-radius: 10px;
    padding: 3px; margin-bottom: 24px; flex-shrink: 0;
  }
  .lang-btn {
    padding: 6px 16px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500;
    background: transparent; color: #8e8e93; cursor: pointer;
  }
  .lang-btn.active { background: #636366; color: #fff; }

  .text-area {
    flex: 1; width: 100%; overflow-y: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 0; min-height: 0;
  }
  .text-content {
    font-size: 22px; line-height: 1.5; text-align: center;
    word-break: break-word; color: #fff; max-width: 100%;
    transition: opacity 0.2s;
  }
  .text-content.placeholder { color: #636366; font-size: 17px; }

  .status-bar {
    flex-shrink: 0; text-align: center; padding: 8px 0 4px;
    font-size: 13px; color: #8e8e93; min-height: 24px;
  }
  .status-bar.loading { color: #ff9f0a; }

  .recording-area {
    flex-shrink: 0; display: flex; flex-direction: column;
    align-items: center; gap: 20px; padding-bottom: 16px;
  }

  .record-btn-outer {
    width: 120px; height: 120px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, background 0.2s;
  }
  .record-btn-outer.idle     { background: #1c1c1e; }
  .record-btn-outer.recording { background: #ff3b30; transform: scale(1.08); animation: pulse 1.2s ease-in-out infinite; }
  .record-btn-outer.processing { background: #ff9f0a; transform: scale(1.05); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.5); }
    50%      { box-shadow: 0 0 0 24px rgba(255,59,48,0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .record-btn-inner {
    width: 104px; height: 104px; border-radius: 50%;
    border: none; background: #2c2c2e; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .recording  .record-btn-inner { background: #ff3b30; }
  .processing .record-btn-inner { background: #ff9f0a; }

  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .recording-hint {
    font-size: 13px; color: #8e8e93; height: 20px;
  }
  .recording  .recording-hint { color: #ff3b30; }
  .processing .recording-hint { color: #ff9f0a; }

  .actions {
    display: flex; gap: 12px; flex-shrink: 0; padding-bottom: 8px;
  }
  .action-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 12px 24px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 500; cursor: pointer;
    background: #1c1c1e; color: #fff;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .action-btn:active  { background: #2c2c2e; }
  .action-btn:disabled { opacity: 0.35; pointer-events: none; }
  .action-btn.primary  { background: #007aff; }
  .action-btn.primary:active { background: #0062cc; }

  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #333; color: #fff;
    padding: 10px 24px; border-radius: 20px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: all 0.25s ease; z-index: 100;
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  .unsupported {
    display: none; text-align: center;
    color: #ff3b30; font-size: 15px;
    padding: 20px 32px; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="app">
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="zh">中文</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>

  <div class="status-bar" id="statusBar">加载模型中...</div>

  <div class="text-area">
    <div class="text-content placeholder" id="textDisplay">按住按钮开始说话</div>
  </div>

  <p class="unsupported" id="unsupported">
    当前浏览器不支持录音<br>请使用 Safari 或 Chrome 打开
  </p>

  <div class="recording-area" id="recordingArea" style="display:none">
    <div class="record-btn-outer idle" id="btnOuter">
      <button class="record-btn-inner" id="recordBtn">
        <span id="btnLabel">按住<br>说话</span>
        <div class="spinner" id="spinner" style="display:none"></div>
      </button>
    </div>
    <div class="recording-hint" id="hint">按住录制，松手完成</div>
  </div>

  <div class="actions">
    <button class="action-btn" id="copyBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      复制
    </button>
    <button class="action-btn primary" id="smsBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      iMessage
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';

// ── DOM refs ──────────────────────────────────────────────
const textDisplay  = document.getElementById('textDisplay');
const recordBtn    = document.getElementById('recordBtn');
const btnOuter     = document.getElementById('btnOuter');
const btnLabel     = document.getElementById('btnLabel');
const spinner      = document.getElementById('spinner');
const hint         = document.getElementById('hint');
const copyBtn      = document.getElementById('copyBtn');
const smsBtn       = document.getElementById('smsBtn');
const toast        = document.getElementById('toast');
const unsupported  = document.getElementById('unsupported');
const recordingArea = document.getElementById('recordingArea');
const statusBar    = document.getElementById('statusBar');
const langBtns     = document.querySelectorAll('.lang-btn');

// ── State ─────────────────────────────────────────────────
let transcriber   = null;
let isRecording   = false;
let isProcessing  = false;
let currentText   = '';
let currentLang   = 'zh';
let mediaRecorder = null;
let audioChunks   = [];

// Choose model — base is good balance for mobile (≈75 MB, good Chinese)
const MODEL = 'Xenova/whisper-small';

// ── Browser check ─────────────────────────────────────────
if (!navigator.mediaDevices || !window.MediaRecorder) {
  unsupported.style.display = 'block';
  recordingArea.style.display = 'none';
  statusBar.textContent = '浏览器不支持录音';
}

// ── Load model ────────────────────────────────────────────
env.allowLocalModels = false;
env.useBrowserCache  = true;

async function loadModel() {
  statusBar.textContent = '加载模型中（首次约250MB，下次秒开）...';
  statusBar.classList.add('loading');

  transcriber = await pipeline('automatic-speech-recognition', MODEL, {
    progress_callback: (info) => {
      if (info.status === 'progress') {
        const pct = info.progress ? Math.round(info.progress) : 0;
        statusBar.textContent = `下载模型中... ${pct}%（仅首次需要）`;
      } else if (info.status === 'done') {
        statusBar.textContent = '模型就绪';
        statusBar.classList.remove('loading');
      }
    }
  });

  recordingArea.style.display = '';
  statusBar.textContent = '就绪';
  statusBar.classList.remove('loading');
}

// Start loading immediately
const modelPromise = loadModel();

// ── Language ──────────────────────────────────────────────
langBtns.forEach(b => {
  b.addEventListener('click', () => {
    currentLang = b.dataset.lang;
    langBtns.forEach(x => x.classList.toggle('active', x.dataset.lang === currentLang));
  });
});

// ── Recording ─────────────────────────────────────────────
async function startRecording() {
  if (isRecording || isProcessing) return;

  // Wait for model if still loading
  if (!transcriber) {
    showToast('模型还在加载中...');
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];

    const mimeType = MediaRecorder.isTypeSupported('audio/mp4')
      ? 'audio/mp4' : 'audio/webm';

    mediaRecorder = new MediaRecorder(stream, { mimeType });

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.start();
    isRecording = true;

    btnOuter.classList.remove('idle', 'processing');
    btnOuter.classList.add('recording');
    btnLabel.style.display = '';
    spinner.style.display = 'none';
    btnLabel.innerHTML = '松开<br>完成';
    hint.textContent = '正在录音...';
  } catch {
    showToast('请允许麦克风权限');
  }
}

function stopRecording() {
  if (!isRecording || !mediaRecorder) return;

  isRecording = false;
  isProcessing = true;

  const recorder = mediaRecorder;
  const stream   = recorder.stream;

  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());

    btnOuter.classList.remove('recording');
    btnOuter.classList.add('processing');
    btnLabel.style.display = 'none';
    spinner.style.display = '';
    hint.textContent = '转写中...';

    const blob = new Blob(audioChunks, { type: recorder.mimeType });
    await runTranscription(blob);

    isProcessing = false;
    btnOuter.classList.remove('processing');
    btnOuter.classList.add('idle');
    btnLabel.style.display = '';
    spinner.style.display = 'none';
    btnLabel.innerHTML = '按住<br>说话';
    hint.textContent = '按住录制，松手完成';
    mediaRecorder = null;
  };

  recorder.stop();
}

// ── Transcription ─────────────────────────────────────────
async function runTranscription(blob) {
  try {
    // Decode compressed audio to AudioBuffer
    const arrayBuf = await blob.arrayBuffer();
    const audioCtx  = new AudioContext();
    let audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    await audioCtx.close();

    // Convert to mono 16kHz Float32Array
    const samples = resampleTo16kMono(audioBuffer);

    const result = await transcriber(samples, {
      language: currentLang,
      task: 'transcribe',
    });

    currentText = result.text.trim();
  } catch (err) {
    console.error('Transcription error:', err);
    // Fallback: try without language hint
    try {
      const arrayBuf = await blob.arrayBuffer();
      const audioCtx  = new AudioContext();
      let audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
      await audioCtx.close();
      const samples = resampleTo16kMono(audioBuffer);
      const result = await transcriber(samples, { task: 'transcribe' });
      currentText = result.text.trim();
    } catch (err2) {
      console.error('Fallback error:', err2);
      showToast('转写失败，请重试');
    }
  }

  updateUIState();
}

// Resample any AudioBuffer → 16kHz mono Float32Array
function resampleTo16kMono(audioBuffer) {
  const numChannels = audioBuffer.numberOfChannels;
  const length      = audioBuffer.length;
  const sampleRate  = audioBuffer.sampleRate;

  // Mix to mono
  const mono = new Float32Array(length);
  for (let c = 0; c < numChannels; c++) {
    const chData = audioBuffer.getChannelData(c);
    for (let i = 0; i < length; i++) mono[i] += chData[i];
  }
  if (numChannels > 1) {
    for (let i = 0; i < length; i++) mono[i] /= numChannels;
  }

  if (sampleRate === 16000) return mono;

  // Simple linear resampling to 16kHz
  const ratio = sampleRate / 16000;
  const newLen = Math.floor(length / ratio);
  const out = new Float32Array(newLen);
  for (let i = 0; i < newLen; i++) {
    const srcIdx = i * ratio;
    const srcFloor = Math.floor(srcIdx);
    const frac = srcIdx - srcFloor;
    const a = mono[srcFloor] || 0;
    const b = mono[Math.min(srcFloor + 1, length - 1)] || 0;
    out[i] = a + (b - a) * frac;
  }
  return out;
}

// ── UI ────────────────────────────────────────────────────
function updateUIState() {
  const hasText = currentText.length > 0;
  copyBtn.disabled = !hasText;
  smsBtn.disabled  = !hasText;

  if (hasText) {
    textDisplay.textContent = currentText;
    textDisplay.classList.remove('placeholder');
  } else {
    textDisplay.textContent = '按住按钮开始说话';
    textDisplay.classList.add('placeholder');
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 1800);
}

// ── Actions ───────────────────────────────────────────────
async function copyText() {
  if (!currentText) return;
  try {
    await navigator.clipboard.writeText(currentText);
    showToast('已复制到剪贴板');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = currentText;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板');
  }
}

function openSMS() {
  if (!currentText) return;
  window.location.href = `sms:&body=${encodeURIComponent(currentText)}`;
}

// ── Pointer events (work for touch + mouse) ───────────────
recordBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  startRecording();
});

recordBtn.addEventListener('pointerup', e => {
  e.preventDefault();
  stopRecording();
});

recordBtn.addEventListener('pointerleave', () => {
  if (isRecording) stopRecording();
});

recordBtn.addEventListener('contextmenu', e => e.preventDefault());

copyBtn.addEventListener('click', copyText);
smsBtn.addEventListener('click', openSMS);

// Double-tap text to clear
textDisplay.addEventListener('dblclick', () => {
  if (currentText) {
    currentText = '';
    updateUIState();
    showToast('已清除');
  }
});
</script>
</body>
</html>
