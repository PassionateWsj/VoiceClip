<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="语音转录">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>语音转录</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: #000; color: #fff;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  .app {
    display: flex; flex-direction: column; align-items: center;
    height: 100%;
    padding: env(safe-area-inset-top, 16px) 24px env(safe-area-inset-bottom, 24px);
  }

  /* ── Top bar ─────────────────────────────── */
  .top-bar {
    width: 100%; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
    padding-bottom: 8px;
  }
  .lang-bar {
    display: flex; gap: 2px; background: #1c1c1e; border-radius: 9px; padding: 2px;
  }
  .lang-btn {
    padding: 7px 14px; border: none; border-radius: 7px;
    font-size: 13px; font-weight: 600;
    background: transparent; color: #8e8e93;
    transition: all 0.2s;
  }
  .lang-btn.active { background: #3a3a3c; color: #fff; }

  /* ── Text display ────────────────────────── */
  .text-area {
    flex: 1; width: 100%; overflow-y: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 0; min-height: 0;
  }
  .text-content {
    font-size: 24px; line-height: 1.6; text-align: center;
    word-break: break-word; color: #fff; max-width: 100%;
    letter-spacing: 0.01em;
    transition: opacity 0.3s ease;
  }
  .text-content.placeholder { color: #48484a; font-size: 16px; font-weight: 400; }

  /* ── Status line ─────────────────────────── */
  .status-line {
    flex-shrink: 0; text-align: center;
    font-size: 12px; color: #48484a;
    min-height: 20px; padding-bottom: 8px;
    transition: color 0.3s;
  }
  .status-line.loading { color: #ff9f0a; }
  .status-line.ready { color: #30d158; }

  /* ── Center button area ──────────────────── */
  .center-area {
    flex-shrink: 0; display: flex; flex-direction: column;
    align-items: center; gap: 24px; padding-bottom: 16px;
  }

  /* Mic enable button */
  .mic-enable-btn {
    padding: 14px 36px; border-radius: 12px; border: none;
    font-size: 17px; font-weight: 600;
    background: #007aff; color: #fff;
    transition: transform 0.15s, opacity 0.15s;
    touch-action: manipulation;
  }
  .mic-enable-btn:active { transform: scale(0.96); opacity: 0.85; }

  /* Recording button — outer ring */
  .btn-outer {
    width: 140px; height: 140px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.25s cubic-bezier(.25,.1,.25,1), box-shadow 0.3s;
  }
  .btn-outer.idle {
    box-shadow: 0 0 0 3px #1c1c1e;
  }
  .btn-outer.recording {
    box-shadow: 0 0 0 3px #ff3b30, 0 0 32px rgba(255,59,48,0.35);
    animation: breathe 1.4s ease-in-out infinite;
  }
  .btn-outer.processing {
    box-shadow: 0 0 0 3px #ff9f0a, 0 0 24px rgba(255,159,10,0.3);
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 3px #ff3b30, 0 0 32px rgba(255,59,48,0.35); }
    50%      { transform: scale(1.04); box-shadow: 0 0 0 5px #ff3b30, 0 0 48px rgba(255,59,48,0.45); }
  }

  /* Inner button */
  .btn-inner {
    width: 124px; height: 124px; border-radius: 50%;
    border: none; color: #fff;
    font-size: 16px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    transition: background 0.25s, transform 0.15s;
  }
  .idle .btn-inner {
    background: #1c1c1e;
  }
  .idle .btn-inner:active {
    transform: scale(0.94);
  }
  .recording .btn-inner {
    background: #ff3b30;
  }
  .processing .btn-inner {
    background: #ff9f0a;
  }

  .mic-svg, .check-svg {
    width: 28px; height: 28px; margin-bottom: 4px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .hint-text {
    font-size: 13px; color: #48484a; min-height: 20px;
    transition: color 0.3s;
  }
  .recording  .hint-text { color: #ff453a; }
  .processing .hint-text { color: #ff9f0a; }

  /* ── Action buttons ──────────────────────── */
  .actions {
    display: flex; gap: 10px; flex-shrink: 0;
  }
  .action-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 13px 22px; border-radius: 26px; border: none;
    font-size: 15px; font-weight: 590;
    background: #1c1c1e; color: #fff;
    transition: transform 0.15s, opacity 0.15s;
    touch-action: manipulation;
  }
  .action-btn:active { transform: scale(0.95); opacity: 0.8; }
  .action-btn:disabled { opacity: 0.3; pointer-events: none; }
  .action-btn.primary  { background: #007aff; }
  .action-btn.primary:active { opacity: 0.85; }

  /* ── Toast ───────────────────────────────── */
  .toast {
    position: fixed; bottom: 120px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: rgba(44,44,46,0.95);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #fff; padding: 10px 22px; border-radius: 22px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: all 0.28s cubic-bezier(.25,.1,.25,1); z-index: 100;
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  .unsupported {
    display: none; text-align: center;
    color: #ff3b30; font-size: 15px;
    padding: 20px 32px; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="app">
  <div class="top-bar">
    <div class="lang-bar">
      <button class="lang-btn active" data-lang="zh">普通话</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>
  </div>

  <div class="text-area">
    <div class="text-content placeholder" id="textDisplay"></div>
  </div>

  <p class="unsupported" id="unsupported">
    当前浏览器不支持录音<br>请使用 Safari 打开
  </p>

  <div class="center-area" id="centerArea" style="display:none">
    <!-- Step 1: enable mic -->
    <button class="mic-enable-btn" id="micEnableBtn" style="display:none">启用麦克风</button>

    <!-- Step 2: press-hold to record -->
    <div id="recordingUI" style="display:none">
      <div class="btn-outer idle" id="btnOuter">
        <button class="btn-inner" id="recordBtn">
          <span id="btnContent">
            <svg class="mic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <span style="font-size:14px" id="btnLabel">按住说话</span>
          </span>
          <div class="spinner" id="spinner" style="display:none"></div>
        </button>
      </div>
      <div class="hint-text" id="hint">按住录制，松手转写</div>
    </div>
  </div>

  <div class="status-line" id="statusBar">加载模型中…</div>

  <div class="actions" id="actions" style="display:none">
    <button class="action-btn" id="copyBtn" disabled>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      复制
    </button>
    <button class="action-btn primary" id="smsBtn" disabled>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      发 iMessage
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';

const textDisplay  = document.getElementById('textDisplay');
const centerArea   = document.getElementById('centerArea');
const micEnableBtn = document.getElementById('micEnableBtn');
const recordingUI  = document.getElementById('recordingUI');
const recordBtn    = document.getElementById('recordBtn');
const btnOuter     = document.getElementById('btnOuter');
const btnContent   = document.getElementById('btnContent');
const btnLabel     = document.getElementById('btnLabel');
const spinner      = document.getElementById('spinner');
const hint         = document.getElementById('hint');
const copyBtn      = document.getElementById('copyBtn');
const smsBtn       = document.getElementById('smsBtn');
const actions      = document.getElementById('actions');
const toast        = document.getElementById('toast');
const unsupported  = document.getElementById('unsupported');
const statusBar    = document.getElementById('statusBar');
const langBtns     = document.querySelectorAll('.lang-btn');

const MODEL     = 'Xenova/whisper-base';
const SMS_TO    = 'grinstimemachine@gmail.com';

let transcriber   = null;
let isRecording   = false;
let isProcessing  = false;
let currentText   = '';
let currentLang   = 'zh';
let mediaRecorder = null;
let audioChunks   = [];
let audioStream   = null;

// ── PWA ───────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

// ── Browser check ─────────────────────────────────────────
if (!navigator.mediaDevices || !window.MediaRecorder) {
  unsupported.style.display = 'block';
  statusBar.textContent = '浏览器不支持录音';
} else {
  textDisplay.textContent = '';
  textDisplay.classList.add('placeholder');
}

// ── Load model ────────────────────────────────────────────
env.allowLocalModels = false;
env.useBrowserCache  = true;

async function loadModel() {
  statusBar.textContent = '加载模型中（首次约 75MB，之后秒开）';
  statusBar.classList.add('loading');

  transcriber = await pipeline('automatic-speech-recognition', MODEL, {
    progress_callback: (info) => {
      if (info.status === 'progress') {
        const pct = info.progress ? Math.round(info.progress) : 0;
        statusBar.textContent = `下载模型中… ${pct}%`;
      } else if (info.status === 'done') {
        statusBar.classList.remove('loading');
      }
    }
  });

  centerArea.style.display = '';
  micEnableBtn.style.display = '';
  actions.style.display = '';
  statusBar.textContent = '点击下方按钮启用麦克风';
}

// ── Step 1: Enable mic ────────────────────────────────────
micEnableBtn.addEventListener('click', async () => {
  micEnableBtn.textContent = '请求权限中…';
  micEnableBtn.disabled = true;

  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micEnableBtn.style.display = 'none';
    recordingUI.style.display = '';
    statusBar.textContent = '就绪 — 按住按钮开始说话';
    statusBar.classList.add('ready');
  } catch {
    micEnableBtn.textContent = '启用麦克风';
    micEnableBtn.disabled = false;
    showToast('请在弹窗中允许麦克风权限');
  }
});

// ── Language ──────────────────────────────────────────────
langBtns.forEach(b => {
  b.addEventListener('click', () => {
    currentLang = b.dataset.lang;
    langBtns.forEach(x => x.classList.toggle('active', x.dataset.lang === currentLang));
  });
});

// ── Step 2: Press-hold recording ──────────────────────────
function startRecording() {
  if (isRecording || isProcessing || !audioStream?.active) return;

  audioChunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
  mediaRecorder = new MediaRecorder(audioStream, { mimeType: mime });

  mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };

  mediaRecorder.start();
  isRecording = true;

  btnOuter.classList.remove('idle', 'processing');
  btnOuter.classList.add('recording');
  hint.textContent = '正在录制…松手完成';
  statusBar.textContent = '● 录音中';
  statusBar.style.color = '#ff453a';
}

function stopRecording() {
  if (!isRecording || !mediaRecorder) return;

  isRecording = false;
  isProcessing = true;

  const recorder = mediaRecorder;

  recorder.onstop = async () => {
    btnOuter.classList.remove('recording');
    btnOuter.classList.add('processing');
    btnContent.style.display = 'none';
    spinner.style.display = '';
    hint.textContent = '转写中…';
    statusBar.textContent = '转写中…';
    statusBar.style.color = '#ff9f0a';

    const blob = new Blob(audioChunks, { type: recorder.mimeType });
    await runTranscription(blob);

    isProcessing = false;
    btnOuter.classList.remove('processing');
    btnOuter.classList.add('idle');
    btnContent.style.display = '';
    spinner.style.display = 'none';
    hint.textContent = '按住录制，松手转写';
    statusBar.textContent = currentText ? '双击文字可清除' : '按住按钮开始说话';
    statusBar.style.color = currentText ? '#48484a' : '';
    statusBar.classList.remove('ready');
    mediaRecorder = null;
  };

  recorder.stop();
}

// ── Transcription ─────────────────────────────────────────
async function runTranscription(blob) {
  try {
    const buf = await blob.arrayBuffer();
    const ctx = new AudioContext();
    let audio = await ctx.decodeAudioData(buf);
    await ctx.close();
    const samples = resample(audio);
    const result = await transcriber(samples, {
      language: currentLang,
      task: 'transcribe',
      chunk_length_s: 30,
      stride_length_s: 5,
    });
    currentText = result.text.trim();
  } catch (err) {
    console.error(err);
    try {
      const buf = await blob.arrayBuffer();
      const ctx = new AudioContext();
      let audio = await ctx.decodeAudioData(buf);
      await ctx.close();
      const result = await transcriber(resample(audio), {
        task: 'transcribe',
        chunk_length_s: 30,
        stride_length_s: 5,
      });
      currentText = result.text.trim();
    } catch (e2) {
      console.error(e2);
      showToast('转写失败，请重试');
    }
  }
  updateUI();
}

function resample(buf) {
  const len = buf.length, sr = buf.sampleRate, ch = buf.numberOfChannels;
  const mono = new Float32Array(len);
  for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) mono[i] += d[i]; }
  if (ch > 1) for (let i = 0; i < len; i++) mono[i] /= ch;
  if (sr === 16000) return mono;
  const r = sr / 16000, nl = ~~(len / r), out = new Float32Array(nl);
  for (let i = 0; i < nl; i++) { const s = i * r, f = ~~s, t = s - f; out[i] = (mono[f]||0) + ((mono[Math.min(f+1,len-1)]||0) - (mono[f]||0)) * t; }
  return out;
}

// ── UI ────────────────────────────────────────────────────
function updateUI() {
  const has = currentText.length > 0;
  copyBtn.disabled = !has;
  smsBtn.disabled  = !has;
  if (has) {
    textDisplay.textContent = currentText;
    textDisplay.classList.remove('placeholder');
  } else {
    textDisplay.textContent = '';
    textDisplay.classList.add('placeholder');
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._tid);
  toast._tid = setTimeout(() => toast.classList.remove('show'), 1800);
}

// ── Actions ───────────────────────────────────────────────
async function copyText() {
  if (!currentText) return;
  try { await navigator.clipboard.writeText(currentText); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = currentText; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  showToast('已复制到剪贴板');
}

function openSMS() {
  if (!currentText) return;
  window.location.href = `sms:${SMS_TO}&body=${encodeURIComponent(currentText)}`;
}

// ── Pointer events ────────────────────────────────────────
recordBtn.addEventListener('pointerdown', e => { e.preventDefault(); startRecording(); });
recordBtn.addEventListener('pointerup',   e => { e.preventDefault(); stopRecording(); });
recordBtn.addEventListener('pointerleave', () => { if (isRecording) stopRecording(); });
recordBtn.addEventListener('contextmenu', e => e.preventDefault());

copyBtn.addEventListener('click', copyText);
smsBtn.addEventListener('click', openSMS);

textDisplay.addEventListener('dblclick', () => {
  if (currentText) { currentText = ''; updateUI(); showToast('已清除'); }
});

loadModel();
</script>
</body>
</html>
